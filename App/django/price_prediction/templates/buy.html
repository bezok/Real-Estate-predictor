{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Properties</title>
    <link rel="stylesheet" href="{% static 'buy.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">RealEstate AI</div>
        <div class="nav-links">
            <a href="/welcome" class="btn-primary">Predict</a>
            <a href="/sell" class="btn-primary">Sell Property</a>
        </div>
    </nav>

    <div class="buy-container">
        <!-- Left side map container -->
        <div class="map-container">
            <iframe src="https://www.google.com/maps/embed?..." frameborder="0"></iframe>
        </div>
        
        <!-- Right side property list -->
        <div class="property-list-container">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search by location or property name...">
            </div>

            <div class="property-list" id="propertyList">
                {% if properties %}
                    {% for property in properties %}
                        <div class="property-card">
                            <img src="{{ property.image_url|default:'/static/placeholder.jpg' }}" alt="{{ property.title }}" class="property-image">
                            <div class="property-details">
                                <h3 class="property-title">{{ property.title }}</h3>
                                <p class="property-location">{{ property.location }}</p>
                                <p class="property-price">₹{{ property.price }} Lakhs</p>
                                <button class="btn-primary view-details" data-id="{{ property.id }}">View Details</button>
                            </div>
                        </div>
                    {% endfor %}
                {% else %}
                    <p>No properties available for sale.</p>
                {% endif %}
            </div>
        </div>
    </div>
    
    <script src="{% static 'buy.js' %}"></script>
</body>
</html>
