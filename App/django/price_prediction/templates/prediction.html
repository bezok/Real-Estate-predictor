{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Real Estate Prediction - Result</title>
    
    <!-- Google Maps API (Replace YOUR_API_KEY with your actual key) -->
    <script async defer 
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA8K635YsOV7QVRLIYHK7yj67DQE&callback=initMap">
 </script>
 

    <link rel="stylesheet" href="{% static 'prediction.css' %}">
</head>
<body>
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <p>Calculating the estimated price, please wait...</p>
    </div>

    <div class="container result">
        <h1>Estimated Property Price</h1>
        <div id="result" class="result-display">
            <h2>Price: ₹ {{predicted_price}}</h2>
        </div>
        <p class="suggestion">
            *Based on current data trends, may be subjected to <span id="suggestion-type">slight variation</span>.
        </p>
    </div>

    <!-- Map Search and Display -->
    

    <!-- Map Container -->
    <div id="map" location"" ></div>
    

    <!-- Load JavaScript -->
    <script src="{% static 'map.js' %}"></script>
</body>
</html>
