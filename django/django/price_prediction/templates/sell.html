{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Property</title>
    <link rel="stylesheet" href="{% static 'buy_sell.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">RealEstate AI</div>
        <div class="nav-links">
            <a href="/buy">Buy</a>
            <a href="/sell" class="btn-primary active">Sell Property</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2>List Your Property</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group">
                    <label for="{{ form.title.id_for_label }}">Property Title</label>
                    {{ form.title }}
                </div>
                <div class="form-group">
                    <label for="{{ form.description.id_for_label }}">Description</label>
                    {{ form.description }}
                </div>
                <div class="form-group">
                    <label for="{{ form.price.id_for_label }}">Price in Lakhs(₹)</label>
                    {{ form.price }}
                </div>
                <div class="form-group">
                    <label for="{{ form.location.id_for_label }}">Location</label>
                    {{ form.location }}
                </div>
                <button type="submit" class="btn-primary submit-btn">List Property</button>
            </form>
        </div>
    </div>
</body>
</html>
